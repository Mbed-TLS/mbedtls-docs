# Readthedocs redirects
# See https://docs.readthedocs.io/en/stable/user-defined-redirects.html
#
# The post-build hook in `.readthedocs.yaml` normally applies changes on
# `main`. PR builds skip the hook to protect the API token.
#
# As of November 2026, the hook is temporarily disabled. While it is
# disabled, apply any changes to this file manually in the Read the Docs
# project dashboard under Admin > Redirects.

- type: html_to_clean_url
  from_url: /
  to_url: /

- type: page
  from_url: /tech-updates/security-advisories
  to_url: /security-advisories/

- type: page
  from_url: /security-advisories/security-advisories
  to_url: /security-advisories/

- type: page
  from_url: /security-advisories/advisories/*
  to_url: /security-advisories/:splat

- type: page
  from_url: /roadmap
  to_url: /project/roadmap/
